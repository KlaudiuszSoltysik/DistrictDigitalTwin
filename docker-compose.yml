services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ddt_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql
    networks:
      - ddt_net
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: ddt_database_backup
    user: postgres:postgres
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@every 4h00m
      - BACKUP_KEEP_DAYS=2
    networks:
      - ddt_net
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  rabbitmq:
    container_name: ddt_rabbitmq
    image: rabbitmq:4.2.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ddt_net
    # healthcheck:
    #   test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  simulation:
    container_name: ddt_simulation
    build:
      context: ./python
    command: python simulation.py
    environment:
      - RABBITMQ_CONNECTION_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    networks:
      - ddt_net
    # depends_on:
    #   rabbitmq:
    #     condition: service_healthy

  digital-twin:
    container_name: ddt_digital_twin
    build:
      context: ./python
    command: python digital_twin.py
    environment:
      - RABBITMQ_CONNECTION_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    networks:
      - ddt_net
    # depends_on:
    #   rabbitmq:
    #     condition: service_healthy

  api:
    container_name: ddt_api
    build:
      context: csharp
      dockerfile: api/Dockerfile
    environment:
      - ConnectionStrings__TelemetryDbConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__RabbitMqConnection=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ASPNETCORE_ENVIRONMENT=Production
    # TODO: remove later and use cloudflare tunnel instead
    ports:
      - "6101:8080"
    networks:
      - ddt_net
    # depends_on:
    #   telemetry_service:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  telemetry_service:
    container_name: ddt_telemetry_service
    build:
      context: csharp
      dockerfile: telemetry_service/Dockerfile
    environment:
      - ConnectionStrings__TelemetryDbConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__RabbitMqConnection=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - ddt_net
    # depends_on:
    #   rabbitmq:
    #     condition: service_healthy
    #   postgres:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  website:
    container_name: ddt_website
    build:
      context: csharp
      dockerfile: website/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    # TODO: remove later and use cloudflare tunnel instead
    ports:
      - "6102:80"
    networks:
      - ddt_net
    # depends_on:
    #   api:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:80"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  watchtower:
    image: containrrr/watchtower
    container_name: ddt_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup --label-enable
    environment:
      - DOCKER_API_VERSION=1.45
    networks:
      - ddt_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ddt_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ddt_net
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: ddt_prometheus
    volumes:
      - ./docker/prometheus/config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=48h"
    networks:
      - ddt_net
    # depends_on:
    #   cadvisor:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  promtail:
    image: grafana/promtail:latest
    container_name: ddt_promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail/config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ddt_net
    # depends_on:
    #   loki:
    #     condition: service_started
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:9080/ready"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  loki:
    image: grafana/loki:latest
    container_name: ddt_loki
    volumes:
      - ./docker/loki/config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ddt_net

  grafana:
    image: grafana/grafana:latest
    container_name: ddt_grafana
    user: "472"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://district-digital-twin-grafana.260824.xyz
    networks:
      - ddt_net
    # depends_on:
    #   prometheus:
    #     condition: service_healthy
    #   loki:
    #     condition: service_started
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ddt_tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # depends_on:
    #   website:
    #     condition: service_healthy
    #   grafana:
    #     condition: service_healthy
    networks:
      - ddt_net

networks:
  ddt_net:
    driver: bridge

volumes:
  postgres_data:
  portainer_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  loki_data:
